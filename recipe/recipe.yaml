schema_version: 1

context:
  name: triad
  version: "1.0.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 37c5d5445356bc280b2a12a1ff9f8668afda125f82a729c48911f44d779e4721

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
  run:
    - python >=${{ python_min }}
    - fsspec >=2022.5.0
    - numpy
    - pandas >=2
    - pyarrow >=6.0.1
    - six
    - packaging

tests:
  - python:
      imports:
        - triad
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: A collection of python utility functions for Fugue projects
  homepage: https://github.com/fugue-project/triad
  repository: https://github.com/fugue-project/triad
  documentation: https://triad.readthedocs.org

extra:
  recipe-maintainers:
    - charlesbluca
    - thewchan
    - kvnkho
    - goodwanghan
    - rdmolony
